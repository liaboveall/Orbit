# F37：受控依赖更新机制。每周检查 npm（pnpm 锁文件）与 GitHub Actions 版本；
# 更新 PR 必须通过冻结安装（--frozen-lockfile）与全套验收，禁止自动合并。
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # 锁步分组：同组包必须一起升级，peerDependencies 范围保证不了这一点——react-dom 运行时要求与 react 版本完全一致，
    # prisma generate 生成的代码绑定同版本 @prisma/client 运行时，@tailwindcss/postcss 精确依赖同版本 tailwindcss。
    # #9 只升了 react 与 @types/react、没升 react-dom，单元测试因版本不一致失败。只写精确包名；
    # 不给这些组加 dependency-type 或 update-types（会把同一家族重新拆开）；日后新增的宽泛分组放在这些组之后。
    groups:
      react:
        applies-to: version-updates
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      prisma:
        applies-to: version-updates
        patterns:
          - "prisma"
          - "@prisma/client"
          - "@prisma/adapter-pg"
      tailwind:
        applies-to: version-updates
        patterns:
          - "tailwindcss"
          - "@tailwindcss/postcss"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
