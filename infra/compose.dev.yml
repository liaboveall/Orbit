# Orbit 本地服务。命令：docker compose -f infra/compose.dev.yml up -d
#
# 隔离：所有端口只绑定 127.0.0.1；测试使用独立数据库 orbit_test，
# 不复用 orbit_dev 数据。
#
# 端口：PostgreSQL 5432 · S3 兼容存储（SeaweedFS）9000 · Mailpit SMTP 宿主 25025→容器 1025 / Web 8025

name: orbit-dev

services:
  postgres:
    image: postgres:17
    container_name: orbit-postgres
    restart: unless-stopped
    ports:
      # 默认 5432。本机 5432 已被其它 PostgreSQL 占用时，
      # 可用 POSTGRES_HOST_PORT 覆盖宿主端口（容器内仍为 5432），
      # 并同步修改 .env.local 的 DATABASE_URL/TEST_DATABASE_URL 端口。
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit_dev_only
      POSTGRES_DB: orbit_dev
    volumes:
      - orbit_pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbit_dev"]
      interval: 5s
      timeout: 5s
      retries: 12

  storage:
    # 本地 S3 兼容存储：SeaweedFS mini（Apache-2.0，ADR-029），取代已归档、公开镜像已下架的 MinIO。
    # 启动时创建 orbit-dev 桶（与 .env.example 的 STORAGE_BUCKET 一致）；关闭“上传时自动建桶”，
    # 保持桶不存在即报错的 S3 语义；关闭默认开启的匿名统计上报。只发布 S3 端口。
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    container_name: orbit-storage
    restart: unless-stopped
    command: ["mini", "-dir=/data", "-bucket=orbit-dev", "-s3.autoCreateBucket=false", "-master.telemetry=false"]
    ports:
      - "127.0.0.1:9000:8333"
    environment:
      # 与 .env.example 的 STORAGE_ACCESS_KEY_ID / STORAGE_SECRET_ACCESS_KEY 对应（仅本地）
      AWS_ACCESS_KEY_ID: orbit_dev_access
      AWS_SECRET_ACCESS_KEY: orbit_dev_secret_change
    volumes:
      - orbit_storage:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12

  mailpit:
    # 本地 SMTP / 邮件查看器（邮件流程属 M1）。开发用浮动标签，生产在 M6 锁定。
    image: axllent/mailpit:latest
    container_name: orbit-mailpit
    restart: unless-stopped
    ports:
      # SMTP 宿主端口默认 25025 → 容器 1025（与 .env.local / .env.example 的 SMTP_PORT=25025 一致）。
      # 不用宿主 1025 的原因：Windows 的动态/临时端口范围常为 1024–15000，宿主 1025 会被
      # 出站连接随机占用导致 bind 失败；25025 在临时区间之外，稳定可用。容器内 Mailpit 始终监听 1025。
      # 如需改宿主端口，用 MAILPIT_SMTP_HOST_PORT 覆盖并同步 .env.local 的 SMTP_PORT。
      - "127.0.0.1:${MAILPIT_SMTP_HOST_PORT:-25025}:1025"
      - "127.0.0.1:${MAILPIT_WEB_HOST_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

volumes:
  orbit_pgdata:
  orbit_storage:
