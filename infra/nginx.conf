# Install inside the HTTPS virtual host managed by the deployment platform.
# Only this proxy may reach the application's bound origin port.
# First include infra/nginx-http.conf in http {}.
access_log /var/log/nginx/orbit-access.log orbit_safe;
# Nginx error logs cannot redact request strings. Use the safe access log for
# status/timing diagnostics and application structured errors for failures.
error_log /dev/null;
add_header Referrer-Policy no-referrer always;
add_header X-Content-Type-Options nosniff always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
# 认证端点专用更小请求体预算（D4 修复）：认证载荷（邮箱/密码/名字）远小于业务 API
# 的 64KiB 上限，按协议先在代理处拒绝超大/伪造声明请求。复制本 location 时必须连同
# 上方安全头与下方 / 的全部 proxy_set_header 一起继承。
location /api/auth/ {
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 150s;
}
location / {
    client_max_body_size 12m;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 150s;
}
