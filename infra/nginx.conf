# Install inside the HTTPS virtual host managed by the deployment platform.
# Only this proxy may reach the application's bound origin port.
# First include infra/nginx-http.conf in http {}.
access_log /var/log/nginx/orbit-access.log orbit_safe;
# Nginx error logs cannot redact request strings. Use the safe access log for
# status/timing diagnostics and application structured errors for failures.
error_log /dev/null;
limit_req_status 429;
limit_conn_status 429;
# Generous per-IP concurrency for shared campus/NAT clients; tune from safe metrics.
limit_conn orbit_per_ip 40;
error_page 429 = @orbit_rate_limited;
location @orbit_rate_limited {
    default_type application/json;
    add_header Retry-After 1 always;
    add_header Cache-Control "private, no-store" always;
    add_header X-Request-Id $request_id always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    return 429 '{"error":{"code":"RATE_LIMITED","message":"请求过于频繁，请稍后重试。"},"meta":{"requestId":"$request_id"}}';
}
add_header Referrer-Policy no-referrer always;
add_header X-Content-Type-Options nosniff always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
# OI-27：应用不使用浏览器权限特性，全站默认拒绝。
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# No includeSubDomains: subdomains such as send.* belong to the mail provider.
add_header Strict-Transport-Security "max-age=31536000" always;
# 反向代理的公共设置写在这一层，下面每个 location 自动继承，新增 location 不会漏掉其中一项。
# 继承规则：location 里一旦自己写了 proxy_set_header 或 add_header，就不再继承这一层的同名指令，
# 所以这些指令只在这里出现。
proxy_http_version 1.1;
# 上游长连接（见 nginx-http.conf 的 upstream orbit_app）要求清空 Connection 头。
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Request-Id $request_id;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For $remote_addr;
# 默认不缓冲：页面流式输出逐块到达浏览器；上传的会话与准入检查先于接收正文。
proxy_buffering off;
proxy_request_buffering off;
proxy_read_timeout 150s;
# 应用自己压缩 HTML；路由处理器返回的 JSON 和 RSC 数据未经压缩，由这里补上。
# 已带 Content-Encoding 的响应原样透传。text/plain 不在列表里，附件下载保持原字节与长度。
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types application/json text/x-component text/css application/javascript text/javascript application/manifest+json image/svg+xml;
# 认证端点专用更小请求体预算（D4 修复）：认证载荷（邮箱/密码/名字）远小于业务 API
# 的 64KiB 上限，按协议先在代理处拒绝超大/伪造声明请求。响应可能带会话令牌，不压缩。
location /api/auth/ {
    limit_req zone=orbit_auth burst=10 nodelay;
    client_max_body_size 64k;
    gzip off;
    proxy_pass http://orbit_app;
}
# 构建产物不可变且从不流式输出：交给 Nginx 缓冲，慢客户端不占用应用的连接。
location /_next/static/ {
    proxy_buffering on;
    proxy_pass http://orbit_app;
}
location / {
    client_max_body_size 12m;
    proxy_pass http://orbit_app;
}
