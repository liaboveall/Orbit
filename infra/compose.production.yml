name: orbit
services:
  web:
    image: ${ORBIT_IMAGE:?Set immutable image tag or digest}
    env_file: ${ORBIT_ENV_FILE:?Set absolute runtime environment file}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    stop_grace_period: 150s
  operations:
    image: ${ORBIT_OPERATIONS_IMAGE:?Set matching operations image}
    env_file: ${ORBIT_ENV_FILE:?Set absolute runtime environment file}
    profiles: [operations]
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
