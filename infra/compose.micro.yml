# Single-host deployment; authoritative configuration for docs/AWS-MICRO-DEPLOYMENT.md
# and docs/OCI-DEPLOYMENT.md. The optional "local-storage" profile runs S3-compatible
# SeaweedFS on the same host (ADR-030); without it, attachments use external S3.
# ORBIT_*_MEM_LIMIT come from /opt/orbit/.env on hosts shared with other sites; 0 means no limit.
name: orbit-showcase
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    mem_limit: ${ORBIT_POSTGRES_MEM_LIMIT:-0}
    env_file: [/opt/orbit/db.env]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *logging
  web:
    image: orbit-web:showcase
    restart: unless-stopped
    mem_limit: ${ORBIT_WEB_MEM_LIMIT:-0}
    init: true
    env_file: [/opt/orbit/app.env]
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    stop_grace_period: 150s
    logging: *logging
  operations:
    image: orbit-operations:showcase
    profiles: [tools]
    mem_limit: ${ORBIT_OPERATIONS_MEM_LIMIT:-0}
    init: true
    env_file: [/opt/orbit/app.env]
    depends_on:
      postgres:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging
  storage:
    # Same pinned multi-arch image as local development. Reachable only on the compose
    # network as http://storage:8333 (no published port). The entrypoint fixes /data
    # ownership and drops to the "seaweed" user, hence CHOWN/SETUID/SETGID.
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    profiles: [local-storage]
    restart: unless-stopped
    mem_limit: ${ORBIT_STORAGE_MEM_LIMIT:-0}
    command: ["mini", "-dir=/data", "-bucket=orbit-attachments", "-s3.autoCreateBucket=false", "-master.telemetry=false"]
    env_file: [/opt/orbit/storage.env]
    volumes:
      - storagedata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    logging: *logging
volumes:
  pgdata:
  storagedata:
