# Single-host deployment. The optional local-storage profile runs SeaweedFS.
# Without it, attachments use an external S3-compatible service.
# ORBIT_*_MEM_LIMIT come from /opt/orbit/.env on hosts shared with other sites; 0 means no limit.
name: orbit-showcase
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    mem_limit: ${ORBIT_POSTGRES_MEM_LIMIT:-0}
    # Sized for a 1 GB container next to other sites: a quarter of it as shared buffers, a
    # connection ceiling well above the app pool (5) plus maintenance, backup and monitoring,
    # and small per-operation memory so a burst of sorts cannot reach the limit.
    # jit=off: every query here is short; JIT compilation only adds latency.
    # pg_stat_statements is preloaded for diagnosis; it stays inert until an operator runs
    # CREATE EXTENSION pg_stat_statements in the postgres maintenance database.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=640MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=40
      - -c
      - jit=off
      - -c
      - shared_preload_libraries=pg_stat_statements
    # Room for parallel-query shared memory; Docker's default /dev/shm is 64 MB.
    shm_size: 128mb
    env_file: [/opt/orbit/db.env]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *logging
  web:
    image: orbit-web:showcase
    restart: unless-stopped
    mem_limit: ${ORBIT_WEB_MEM_LIMIT:-0}
    init: true
    env_file: [/opt/orbit/app.env]
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    stop_grace_period: 150s
    logging: *logging
  operations:
    image: orbit-operations:showcase
    profiles: [tools]
    mem_limit: ${ORBIT_OPERATIONS_MEM_LIMIT:-0}
    init: true
    env_file: [/opt/orbit/app.env]
    depends_on:
      postgres:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging
  storage:
    # Same pinned multi-arch image as local development. Reachable only on the compose
    # network as http://storage:8333 (no published port). The entrypoint fixes /data
    # ownership and drops to the "seaweed" user, hence CHOWN/SETUID/SETGID.
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    profiles: [local-storage]
    restart: unless-stopped
    mem_limit: ${ORBIT_STORAGE_MEM_LIMIT:-0}
    command: ["mini", "-dir=/data", "-bucket=orbit-attachments", "-s3.autoCreateBucket=false", "-master.telemetry=false"]
    env_file: [/opt/orbit/storage.env]
    volumes:
      - storagedata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    logging: *logging
volumes:
  pgdata:
  storagedata:
