# Orbit virtual hosts on the shared server; install as /etc/nginx/sites-available/orbit.
# smartorbit.tech is canonical. www and the original sslip.io name only redirect.
# The server's catch-all site owns default_server, so nothing here may set it.
# Each hostname has its own certificate, issued through the /var/www/orbit-acme webroot.
server {
    listen 80;
    server_name smartorbit.tech www.smartorbit.tech 149-118-55-232.sslip.io;
    server_tokens off;
    access_log off;
    error_log /dev/null;
    location /.well-known/acme-challenge/ {
        root /var/www/orbit-acme;
    }
    location / {
        return 301 https://smartorbit.tech$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.smartorbit.tech;
    server_tokens off;
    access_log off;
    error_log /dev/null;
    ssl_certificate /etc/letsencrypt/live/www.smartorbit.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.smartorbit.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://smartorbit.tech$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name 149-118-55-232.sslip.io;
    server_tokens off;
    access_log off;
    error_log /dev/null;
    ssl_certificate /etc/letsencrypt/live/149-118-55-232.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/149-118-55-232.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://smartorbit.tech$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name smartorbit.tech;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/smartorbit.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartorbit.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/orbit.conf;
}
