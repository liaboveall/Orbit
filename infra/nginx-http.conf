# Include in http {}, before the Orbit server blocks. No client-controlled strings.
limit_req_zone $binary_remote_addr zone=orbit_auth:1m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=orbit_per_ip:1m;
# Deliberately omit URI (path tokens too), query, Referer, cookies and user agent.
map $request_method $orbit_method {
    default OTHER;
    GET GET;
    HEAD HEAD;
    POST POST;
    PUT PUT;
    PATCH PATCH;
    DELETE DELETE;
    OPTIONS OPTIONS;
}
map $uri $orbit_route {
    default other;
    ~^/(api/auth|auth)(/|$) auth;
    ~^/api/v1/attachments(/|$) attachment;
    ~^/api/v1(/|$) business_api;
    ~^/health(/|$) health;
    ~^/_next(/|$) static;
    ~^/app(/|$) app;
    ~^/invite(/|$) invite;
}
log_format orbit_safe escape=json '{"time":"$time_iso8601","requestId":"$request_id","route":"$orbit_route","method":"$orbit_method","status":$status,"bytes":$body_bytes_sent,"durationSeconds":$request_time,"upstreamStatus":"$upstream_status","upstreamConnectSeconds":"$upstream_connect_time","upstreamResponseSeconds":"$upstream_response_time","rateLimit":"$limit_req_status","connectionLimit":"$limit_conn_status"}';
