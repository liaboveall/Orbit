<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Orbit 站点图标：与 OrbitMark 同一图形（中心星、倾斜轨道、轨道上的行星），
       白色标记压在品牌蓝的圆角方块上，16px 下仍可辨识。 -->
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d8ef2"/>
      <stop offset="1" stop-color="#0066d6"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7.5" fill="url(#fill)"/>
  <ellipse cx="16" cy="16" rx="11.5" ry="5.2" fill="none" stroke="#ffffff" stroke-opacity="0.62" stroke-width="1.8" transform="rotate(-28 16 16)"/>
  <circle cx="16" cy="16" r="4" fill="#ffffff"/>
  <circle cx="26.15" cy="10.6" r="2.1" fill="#ffffff"/>
</svg>
